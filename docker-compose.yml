services:
  stt-gateway:
    build: .
    container_name: stt-gateway
    restart: unless-stopped
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLIENT_KEYS=${CLIENT_KEYS}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-15}
      - CORRECTION_ENABLED=${CORRECTION_ENABLED:-true}
      - LOCAL_WHISPER_ENABLED=${LOCAL_WHISPER_ENABLED:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DAILY_REQUEST_LIMIT=${DAILY_REQUEST_LIMIT:-2000}
      # Model names are plain env vars — upgrade providers without a code
      # change or image rebuild; just edit these and restart.
      - GROQ_MODEL=${GROQ_MODEL:-whisper-large-v3-turbo}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash-lite}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cpus: "1.0"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
